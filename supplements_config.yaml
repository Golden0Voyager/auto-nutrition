routines:
  morning_stack:
    name: "晨补 (Morning Stack)"
    aliases: ["晨间补剂", "晨间活力包", "早上的补剂", "早起补剂", "晨补", "早餐补剂", "补剂"]
    items:
      - { name: "辅酶Q10", calories: 0, macros: { carbs: 0, protein: 0, fat: 0 } }
      - { name: "B族维生素", calories: 0, macros: { carbs: 0, protein: 0, fat: 0 } }
      - { name: "鱼油", calories: 10, macros: { carbs: 0, protein: 0, fat: 1.1 } }
      - { name: "D3+K2", calories: 0, macros: { carbs: 0, protein: 0, fat: 0 } }
    # 鱼油早餐 1 粒（2026-10-26 从 2 粒下调，全天合计 600mg EPA+DHA）；
    # D3+K2 为隔天 1 粒（天天调用晨补会多记一天，按需删）

  dinner_stack:
    name: "晚餐补剂 (Dinner Stack)"
    aliases: ["晚餐补剂", "晚饭补剂", "晚餐随餐补剂"]
    items:
      - { name: "Move Free", calories: 0, macros: { carbs: 0, protein: 0, fat: 0 } }
      - { name: "鱼油", calories: 10, macros: { carbs: 0, protein: 0, fat: 1.1 } }
      - { name: "肌酸", calories: 0, macros: { carbs: 0, protein: 0, fat: 0 } }
    # 鱼油晚餐 1 粒（2026-10-26 从 2 粒下调，全天合计 600mg EPA+DHA）。
    # 肌酸是每日 3g 恒量，放在晚餐段保证「每天必记且只记一次」；
    # 不要放回 workout_stack——那样训练日必重复（幂等键按餐次隔离，Snacks 与 Lunch/Dinner 永不相等）。

  night_stack:
    name: "睡前补剂 (Night Stack)"
    aliases: ["睡前补剂", "晚上的补剂", "睡觉前的", "睡前包", "晚补"]
    items:
      - { name: "锌镁片", calories: 4.8, macros: { carbs: 1.2, protein: 0, fat: 0 } }
    # 训练日 2 片 / 休息日 1 片；与晚餐钙片间隔 >3h

  workout_stack:
    name: "训练日补剂 (Workout Stack)"
    aliases: ["训练日补剂", "训练补剂", "训练日套餐", "训练套餐", "训练日补给", "workout", "workout stack"]
    items:
      - { name: "甜菜根粉", calories: 35, macros: { carbs: 8, protein: 1, fat: 0 }, micros: { sugar: 6, potassium: 250, fiber: 1.5, iron: 3 } }
      - { name: "Whey Protein", calories: 120, macros: { carbs: 3, protein: 24, fat: 1.5 }, micros: { calcium: 10, sodium: 100, cholesterol: 55 } }
      - { name: "Milk (Full Cream, 250ml)", calories: 150, macros: { carbs: 12, protein: 8, fat: 8 }, micros: { calcium: 25, potassium: 350, sodium: 100, vitamin_d: 12 } }
    # 一次调用记全 3 项：甜菜根在练前 2-2.5h，乳清/牛奶在练后 30min。
    # 一天只调一次；分两次记会重复记账。
    # 肌酸已移到 dinner_stack（每日恒量，不该跟训练日绑定）。

