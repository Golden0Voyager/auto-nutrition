# Auto_Nutrition Local Config - 补剂与常驻食物库
# 包含丰富的中西方高频饮食、多国特色菜肴及运动补剂标准库，作为 LLM 识别锚点，防止内容幻觉。

metadata:
  version: "1.1"
  description: "与 MFP (MyFitnessPal) API 对齐的营养素单位规范"
  unit_reference:
    macros:
      calories: "kcal"
      carbs: "g"
      protein: "g"
      fat: "g"
      fiber: "g"
      sugar: "g"
    micros_mfp:
      sodium: "mg"
      potassium: "mg"
      cholesterol: "mg"
      saturated_fat: "g"
      polyunsaturated_fat: "g"
      monounsaturated_fat: "g"
      trans_fat: "g"
      calcium: "%DV (Base: 1300mg)"
      iron: "%DV (Base: 18mg)"
      vitamin_a: "%DV (Base: 900mcg RAE)"
      vitamin_c: "%DV (Base: 90mg)"
      vitamin_d: "%DV (Base: 20mcg)"
    micros_local: # 仅用于本地日志记录，不推送至 MFP
      magnesium: "mg"
      zinc: "mg"
      caffeine: "mg"
      epa: "mg"
      dha: "mg"
      curcumin: "mg"
      glucosamine: "mg"
      vitamin_b1: "mg"
      vitamin_b2: "mg"
      vitamin_b6: "mg"
      vitamin_b12: "mcg"

