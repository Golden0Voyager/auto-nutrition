# Auto_Nutrition Local Config - 补剂与常驻食物库
# 包含丰富的中西方高频饮食、多国特色菜肴及运动补剂标准库，作为 LLM 识别锚点，防止内容幻觉。

metadata:
  version: "1.1"
  description: "与 MFP (MyFitnessPal) API 对齐的营养素单位规范"
  unit_reference:
    macros:
      calories: "kcal"
      carbs: "g"
      protein: "g"
      fat: "g"
      fiber: "g"
      sugar: "g"
    micros_mfp:
      sodium: "mg"
      potassium: "mg"
      cholesterol: "mg"
      saturated_fat: "g"
      polyunsaturated_fat: "g"
      monounsaturated_fat: "g"
      trans_fat: "g"
      calcium: "%DV (Base: 1300mg)"
      iron: "%DV (Base: 18mg)"
      vitamin_a: "%DV (Base: 900mcg RAE)"
      vitamin_c: "%DV (Base: 90mg)"
      vitamin_d: "%DV (Base: 20mcg)"
    micros_local: # 仅用于本地日志记录，不推送至 MFP
      magnesium: "mg"
      zinc: "mg"
      caffeine: "mg"
      epa: "mg"
      dha: "mg"
      curcumin: "mg"
      glucosamine: "mg"
      vitamin_b1: "mg"
      vitamin_b2: "mg"
      vitamin_b6: "mg"
      vitamin_b12: "mcg"

supplements:
  # --- 基础与恢复补剂 ---
  maurten_100:
    name: "Maurten Gel 100 (Energy Gel)"
    calories: 100
    macros: { carbs: 25, protein: 0, fat: 0 }
    micros: { sugar: 12.5, sodium: 28, caffeine: 0 } # 100 版不含咖啡因，100 CAF 为 100mg
    aliases: ["能量胶", "补给胶", "马丁胶", "马丁", "Gel", "Maurten", "100胶"]
  electrolytes_tablet:
    name: "Electrolyte Tab / Salt Pill (电解质盐丸/无糖泡腾片)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros: { sodium: 300, potassium: 150 }
    aliases: ["盐丸", "电解质片", "电解质冲剂", "补盐", "吃颗盐", "Salt Pill", "泡腾片", "S-Caps"]
  creatine_monohydrate_3g:
    name: "Creatine Monohydrate (一水肌酸 3g - 99.9% 纯度)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    aliases: ["肌酸", "一水肌酸", "肌酸粉", "creatine", "Creatine", "Creatine Monohydrate", "3g肌酸"]
    # 服用建议：每日 3g 恒量（不做冲击期）；随晚餐服用（已从训练包移出，见 dinner_stack）；250-300ml 温水
  d3_k2_1cap:
    name: "Vitamin D3 + K2 [M] (Sports Research 植物源 1粒 - D3 5000IU / K2 100mcg)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros:
      vitamin_d: 625 # 125mcg / 20mcg（MFP 用 %DV）
      vitamin_k: 100 # MK-7，mcg；MFP 无该字段，仅本地日志
    aliases: ["D3", "K2", "D3K2", "D3+K2", "维生素D3", "维生素K2", "Sports Research", "阳光瓶"]
    # 服用建议：隔天 1 粒（日均 2500IU），随含脂早餐
  coq10_1cap:
    name: "CoQ10 [M] (三金牌 辅酶Q10 1粒 - 泛醌 36-50mg)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros: { coq10: 45 } # 按 36-50mg 取中值；仅本地日志
    aliases: ["辅酶Q10", "辅酶Q10片", "Q10", "CoQ10", "泛醌", "三金"]
    # 服用建议：每日 1 粒，随含脂早餐（与鱼油、D3+K2 同服）
  zma_2tabs:
    name: "ZMA [M] (诺特兰德 锌镁片 2片 - Mg 265mg / Zn 10.5mg)"
    calories: 4.8
    macros: { carbs: 1.2, protein: 0, fat: 0 }
    micros: { magnesium: 265, zinc: 10.5, vitamin_b1: 1, vitamin_b2: 1, vitamin_b6: 1 }
    aliases: ["锌镁片", "锌镁", "ZMA", "诺特兰德", "镁锌片"]
    # 服用建议：训练日睡前 30-60 分钟 2 片，休息日 1 片；与晚餐钙片间隔 >3h，勿用牛奶送服

  # --- 精准运动功能饮料与补剂 ---
  gatorade_600ml:
    name: "Gatorade (佳得乐运动饮料 600ml)"
    calories: 156
    macros: { carbs: 39, protein: 0, fat: 0 }
    micros: { sodium: 270, potassium: 75, sugar: 36 }
    aliases: ["佳得乐", "gatorade", "运动饮料", "解渴水", "蓝水", "橙水"]
  pocari_sweat_500ml:
    name: "Pocari Sweat (宝矿力水特 500ml)"
    calories: 135
    macros: { carbs: 33, protein: 0, fat: 0 }
    micros: { sodium: 245, potassium: 100, sugar: 31 }
    aliases: ["宝矿力", "宝矿力水特", "pocari", "水特", "白水", "Pocari Sweat"]

  # --- 专业功能补剂 ---
  whey_protein_1scoop:
    name: "Whey Protein Concentrate (乳清蛋白粉 1 Scoop)"
    calories: 120
    macros: { carbs: 3, protein: 24, fat: 1.5 }
    micros: 
      calcium: 10.8 # 140mg / 1300mg
      sodium: 46.8
      cholesterol: 4.8
      iron: 1.9
      potassium: 150
    # 必须带英文别名：训练包用的是 "Whey Protein"，缺别名会落到 USDA 按 100g 匹配成 ~352 kcal
    aliases: ["蛋白粉", "乳清蛋白", "Whey Protein", "Whey Protein Concentrate"]
  fish_oil_1cap:
    name: "Fish Oil (Swisse 无腥味野生鱼油 1粒 - EPA 180 / DHA 120)"
    calories: 10
    macros: { carbs: 0, protein: 0, fat: 1.1 }
    micros: 
      epa: 180
      dha: 120
      saturated_fat: 0.3
      polyunsaturated_fat: 0.6
      monounsaturated_fat: 0.2
      cholesterol: 5.7
      vitamin_a: 33.3 # 300mcg / 900mcg
      vitamin_d: 12.5 # 2.5mcg / 20mcg
    aliases: ["鱼油", "Swisse", "无腥味鱼油", "野生鱼油", "Omega-3", "omega3"]
    # 服用建议：每日 2 粒（早餐 1 + 晚餐 1），合计 600mg EPA+DHA。
    # 2026-10-26 从「每日 3-4 粒（900-1200mg）」下调——1200mg 虽在安全区间
    # （FDA 上限 3000mg），但对基础保健属边际收益递减，减半即可。
  beetroot_powder:
    name: "Beetroot Powder (甜菜根粉 1份)"
    calories: 35
    macros: { carbs: 8, protein: 1, fat: 0 }
    micros: { sugar: 6, potassium: 250, fiber: 1.5, iron: 3 }
    aliases: ["甜菜根粉", "甜菜根", "甜菜根冲剂", "beetroot"]
    # 服用建议：训练前 2-2.5 小时温水冲服；当天避免杀菌漱口水；与晚餐钙片间隔 3h
  calcium_pill:
    name: "Calcium Supplement (钙片 1片 - 600mg)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros: { calcium: 46.1, vitamin_d: 10 } # 600mg / 1300mg
    aliases: ["钙片"]
  magnesium_pill:
    name: "Magnesium [M] (镁 200mg - 高吸收甘氨酸镁)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros: { magnesium: 200 }
    aliases: ["镁片", "补镁"]
  curcumin_pill:
    name: "Curcumin [M] (Piping Rock 姜黄素复合 1000mg + 胡椒碱 5mg)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros: { curcumin: 1000, piperine: 5 }
    aliases: ["姜黄素", "姜黄", "Piping Rock", "姜黄素复合", "胡椒碱"]
    # 服用建议：仅大训练日/酸痛日随午餐 1 粒，休息日停用；胆囊结晶者避免空腹服用
  glucosamine_pill:
    name: "Glucosamine + Calcium [M] (Move Free 进阶版 2片 - 氨糖 1500mg / 钙 600mg)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros:
      glucosamine: 1500
      calcium: 46.2 # 600mg / 1300mg（MFP 用 %DV）
    aliases: ["氨糖", "氨糖软骨素", "关节片", "Move Free", "益节", "氨糖钙片"]
    # 服用建议：每日 2 粒，晚餐随餐；与早间辅酶Q10、睡前锌镁片各错开 3h
  vitamin_b_complex:
    name: "Vitamin B Complex (康纽莱 多种B族 1片)"
    calories: 0
    macros: { carbs: 0, protein: 0, fat: 0 }
    micros:
      vitamin_b1: 7.5
      vitamin_b2: 6
      vitamin_b6: 6
      vitamin_b3: 7.5
      vitamin_b5: 7.2
    aliases: ["维生素B", "VB", "B族", "B族维生素", "康纽莱"]
    # 服用建议：每日 1 片，早餐后

