name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run ruff check
        run: uv run ruff check mfp_adapter.py tests/

      - name: Run mypy
        run: uv run mypy mfp_adapter.py || true
      - name: Run security scan (bandit)
        run: uv tool run bandit -r . || true

      # `uv audit` is not a subcommand of uv: this step errored on every run and
      # `|| true` turned that into a green tick, so nothing was ever audited.
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off


      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing tests/

      - name: Enforce coverage threshold
        run: uv run coverage report
