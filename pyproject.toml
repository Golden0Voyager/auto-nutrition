[project]
name = "auto-nutrition-mcp"
version = "1.3.0"
description = "A Model Context Protocol (MCP) server for parsing and recording nutrition and body metrics to MyFitnessPal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.scripts]
auto-nutrition-mcp = "mfp_adapter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 由于项目是单文件结构，显式包含核心文件
include = [
    "/mfp_adapter.py",
    "/supplements_config.yaml"
]

[tool.hatch.build.targets.sdist]
include = [
    "/mfp_adapter.py",
    "/supplements_config.yaml",
    "/README.md"
]
