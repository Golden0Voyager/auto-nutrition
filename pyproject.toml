[project]
name = "auto-nutrition-mcp"
version = "1.3.0"
description = "A Model Context Protocol (MCP) server for parsing and recording nutrition and body metrics to MyFitnessPal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
auto-nutrition-mcp = "mfp_adapter:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["mfp_adapter"]
omit = [
    "tests/*",
    "utils/*",
    "scripts/*",
    "test_user_input.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B007", "B017", "B904", "SIM102", "SIM108", "SIM114", "SIM117", "SIM118", "N806", "E701", "W293", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 由于项目是单文件结构，显式包含核心文件
include = [
    "/mfp_adapter.py",
    "/supplements_config.yaml"
]

[tool.hatch.build.targets.sdist]
include = [
    "/mfp_adapter.py",
    "/supplements_config.yaml",
    "/README.md"
]
